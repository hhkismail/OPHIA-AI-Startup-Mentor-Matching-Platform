name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            ophia-*/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ophia-backend/requirements.txt -r ophia-frontend/requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # Tests use fakes for Firestore, Vertex AI and Google Workspace:
      # no credentials or network access needed.
      - name: Test
        run: pytest -v

  # The production FirestoreRepository against Google's Firestore emulator:
  # real transactions and contention, no credentials or cloud project needed.
  firestore-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ophia-*/requirements.txt
            requirements-dev.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pip install -r ophia-backend/requirements.txt -r ophia-frontend/requirements.txt -r requirements-dev.txt

      - name: Integration tests on the Firestore emulator
        run: npx --yes firebase-tools@13.29.1 emulators:exec --only firestore --project demo-ophia "pytest tests/integration -v"

  # The image builds, the dashboard serves the snapshot, and the backend starts
  # (without cloud credentials it reports Firestore as unavailable, by design).
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t ophia .

      - name: Dashboard serves (default command)
        run: |
          docker run -d --name dash -p 8501:8501 ophia
          for i in $(seq 30); do curl -fs http://localhost:8501/_stcore/health && break; sleep 2; done
          curl -fs http://localhost:8501/_stcore/health
          # The health check passes even if app.py would crash, so render it too
          docker exec dash python -c "
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file('/app/ophia-frontend/app.py').run(timeout=60)
          assert not at.exception, at.exception
          assert at.session_state.data_source == 'snapshot', at.session_state.data_source
          print('rendered from', at.session_state.data_source)"

      - name: Backend starts (compose command)
        run: |
          docker run -d --name api -p 8000:8000 ophia uvicorn app:app --app-dir ophia-backend --host 0.0.0.0 --port 8000
          for i in $(seq 30); do curl -fs http://localhost:8000/api/health && break; sleep 2; done
          curl -fs http://localhost:8000/api/health | tee health.json
          grep -q '"status"' health.json
          curl -fs http://localhost:8000/openapi.json > /dev/null

      - name: Logs on failure
        if: failure()
        run: docker logs dash; docker logs api
